<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>💌 Приглашение на свидание</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
    background: linear-gradient(135deg, #ff9a9e 0%, #fecfef 50%, #a18cd1 100%);
    background-size: 400% 400%;
    animation: bgMove 12s ease infinite;
    padding: 20px;
    transition: background 0.6s ease;
  }

  @keyframes bgMove {
    0%, 100% { background-position: 0% 50%; }
    50% { background-position: 100% 50%; }
  }

  /* --- Темы --- */
  body.theme-default {
    background: linear-gradient(135deg, #ff9a9e 0%, #fecfef 50%, #a18cd1 100%);
    background-size: 400% 400%;
    animation: bgMove 12s ease infinite;
  }
  body.theme-romantic {
    background: linear-gradient(135deg, #2b0a1e 0%, #6b1e3e 40%, #c0396b 100%);
    background-size: 400% 400%;
    animation: bgMove 14s ease infinite;
  }
  body.theme-forest {
    background: linear-gradient(135deg, #1a3a1a 0%, #2d5a2d 45%, #6b8f5e 100%);
    background-size: 400% 400%;
    animation: bgMove 16s ease infinite;
  }
  body.theme-italy {
    background: linear-gradient(135deg, #0b6b3a 0%, #f5f5f5 50%, #c0392b 100%);
    background-size: 400% 400%;
    animation: bgMove 15s ease infinite;
  }
  body.theme-georgia {
    background: linear-gradient(135deg, #f5f5f5 0%, #e74c3c 50%, #b03a2e 100%);
    background-size: 400% 400%;
    animation: bgMove 15s ease infinite;
  }
  body.theme-asia {
    background: linear-gradient(135deg, #7a1f1f 0%, #d4a017 50%, #b8860b 100%);
    background-size: 400% 400%;
    animation: bgMove 15s ease infinite;
  }
  body.theme-general {
    background: linear-gradient(135deg, #1f2a44 0%, #3d4a6b 50%, #5a4a7a 100%);
    background-size: 400% 400%;
    animation: bgMove 15s ease infinite;
  }

  .card {
    position: relative;
    z-index: 1;
    background: rgba(255, 255, 255, 0.92);
    backdrop-filter: blur(10px);
    border-radius: 24px;
    padding: 36px 28px;
    max-width: 480px;
    width: 100%;
    min-height: 480px;
    box-shadow: 0 20px 60px rgba(0, 0, 0, 0.25);
    text-align: center;
    overflow: hidden;
    transition: background 0.5s ease;
  }

  /* Тёмные темы: карточка и текст */
  body.theme-romantic .card { background: rgba(40, 10, 25, 0.88); color: #fce4ec; }
  body.theme-romantic h1, body.theme-romantic .question { color: #ffb6c1; }
  body.theme-romantic .subtitle, body.theme-romantic .hint { color: #d4a0b0; }
  body.theme-romantic .date-option { background: rgba(80, 20, 40, 0.6); }
  body.theme-romantic .date-option .date-main { color: #ffb6c1; }
  body.theme-romantic .date-option .weather { color: #e0b0c0; }
  body.theme-romantic .result { background: rgba(80, 20, 40, 0.6); color: #fce4ec; }
  body.theme-romantic .result b { color: #ffb6c1; }
  body.theme-romantic .love-note { background: linear-gradient(135deg, #4a1025, #6b1e3e); color: #ffb6c1; }
  body.theme-romantic button.ghost { background: rgba(80, 20, 40, 0.6); color: #ffb6c1; }
  body.theme-romantic .attempts { color: #d4a0b0; }
  body.theme-romantic .attempts b { color: #ffb6c1; }
  body.theme-romantic .custom-input-wrap input {
    background: rgba(80, 20, 40, 0.6); color: #fce4ec; border-color: #6b1e3e;
  }
  body.theme-romantic .custom-input-wrap input:focus { border-color: #ffb6c1; }
  body.theme-romantic .custom-input-wrap input::placeholder { color: #d4a0b0; }

  body.theme-forest .card { background: rgba(15, 35, 15, 0.9); color: #e8f5e9; }
  body.theme-forest h1, body.theme-forest .question { color: #a5d6a7; }
  body.theme-forest .subtitle, body.theme-forest .hint { color: #90b890; }
  body.theme-forest .date-option { background: rgba(30, 60, 30, 0.6); }
  body.theme-forest .date-option .date-main { color: #a5d6a7; }
  body.theme-forest .date-option .weather { color: #b0d0b0; }
  body.theme-forest .result { background: rgba(30, 60, 30, 0.6); color: #e8f5e9; }
  body.theme-forest .result b { color: #a5d6a7; }
  body.theme-forest .love-note { background: linear-gradient(135deg, #1a3a1a, #2d5a2d); color: #a5d6a7; }
  body.theme-forest button.ghost { background: rgba(30, 60, 30, 0.6); color: #a5d6a7; }
  body.theme-forest .attempts { color: #90b890; }
  body.theme-forest .attempts b { color: #a5d6a7; }
  body.theme-forest .custom-input-wrap input {
    background: rgba(30, 60, 30, 0.6); color: #e8f5e9; border-color: #2d5a2d;
  }
  body.theme-forest .custom-input-wrap input:focus { border-color: #a5d6a7; }
  body.theme-forest .custom-input-wrap input::placeholder { color: #90b890; }

  body.theme-italy .card,
  body.theme-georgia .card,
  body.theme-asia .card,
  body.theme-general .card {
    background: rgba(30, 15, 20, 0.88); color: #fce4ec;
  }
  body.theme-italy h1, body.theme-italy .question,
  body.theme-georgia h1, body.theme-georgia .question,
  body.theme-asia h1, body.theme-asia .question,
  body.theme-general h1, body.theme-general .question { color: #ffd166; }
  body.theme-italy .subtitle, body.theme-italy .hint,
  body.theme-georgia .subtitle, body.theme-georgia .hint,
  body.theme-asia .subtitle, body.theme-asia .hint,
  body.theme-general .subtitle, body.theme-general .hint { color: #d4a0b0; }
  body.theme-italy .date-option, body.theme-georgia .date-option,
  body.theme-asia .date-option, body.theme-general .date-option {
    background: rgba(60, 20, 30, 0.6);
  }
  body.theme-italy .date-option .date-main, body.theme-georgia .date-option .date-main,
  body.theme-asia .date-option .date-main, body.theme-general .date-option .date-main { color: #ffd166; }
  body.theme-italy .date-option .weather, body.theme-georgia .date-option .weather,
  body.theme-asia .date-option .weather, body.theme-general .date-option .weather { color: #e0b0c0; }
  body.theme-italy .result, body.theme-georgia .result,
  body.theme-asia .result, body.theme-general .result {
    background: rgba(60, 20, 30, 0.6); color: #fce4ec;
  }
  body.theme-italy .result b, body.theme-georgia .result b,
  body.theme-asia .result b, body.theme-general .result b { color: #ffd166; }
  body.theme-italy .love-note, body.theme-georgia .love-note,
  body.theme-asia .love-note, body.theme-general .love-note {
    background: linear-gradient(135deg, #4a1025, #6b1e3e); color: #ffd166;
  }
  body.theme-italy button.ghost, body.theme-georgia button.ghost,
  body.theme-asia button.ghost, body.theme-general button.ghost {
    background: rgba(60, 20, 30, 0.6); color: #ffd166;
  }
  body.theme-italy .attempts, body.theme-georgia .attempts,
  body.theme-asia .attempts, body.theme-general .attempts { color: #d4a0b0; }
  body.theme-italy .attempts b, body.theme-georgia .attempts b,
  body.theme-asia .attempts b, body.theme-general .attempts b { color: #ffd166; }
  body.theme-italy .custom-input-wrap input, body.theme-georgia .custom-input-wrap input,
  body.theme-asia .custom-input-wrap input, body.theme-general .custom-input-wrap input {
    background: rgba(60, 20, 30, 0.6); color: #fce4ec; border-color: #6b1e3e;
  }
  body.theme-italy .custom-input-wrap input:focus,
  body.theme-georgia .custom-input-wrap input:focus,
  body.theme-asia .custom-input-wrap input:focus,
  body.theme-general .custom-input-wrap input:focus { border-color: #ffd166; }
  body.theme-italy .custom-input-wrap input::placeholder,
  body.theme-georgia .custom-input-wrap input::placeholder,
  body.theme-asia .custom-input-wrap input::placeholder,
  body.theme-general .custom-input-wrap input::placeholder { color: #d4a0b0; }

  h1 { font-size: 1.6rem; color: #c0396b; margin-bottom: 8px; }
  .subtitle { color: #8a6a8a; font-size: 0.95rem; margin-bottom: 22px; }
  .question { font-size: 1.15rem; color: #3a2a3a; margin-bottom: 20px; line-height: 1.5; min-height: 56px; }
  .buttons { display: flex; flex-direction: column; gap: 10px; margin-top: 8px; }

  button {
    border: none; border-radius: 14px; padding: 14px 18px; font-size: 1rem;
    font-weight: 600; cursor: pointer; transition: all 0.2s ease; color: #fff;
    background: linear-gradient(135deg, #e8567a, #b0447a);
    box-shadow: 0 6px 18px rgba(200, 60, 120, 0.35);
  }
  button:hover { transform: translateY(-2px); box-shadow: 0 10px 24px rgba(200, 60, 120, 0.5); }
  button:active { transform: translateY(0); }
  button.secondary {
    background: linear-gradient(135deg, #8e6cb0, #5b5bd6);
    box-shadow: 0 6px 18px rgba(100, 90, 200, 0.35);
  }
  button.secondary:hover { box-shadow: 0 10px 24px rgba(100, 90, 200, 0.5); }
  button.ghost { background: #f0e6f0; color: #8a4a7a; box-shadow: none; }
  button.ghost:hover { background: #e8d8e8; box-shadow: none; }

  #btn-no { position: relative; transition: left 0.25s ease, top 0.25s ease, transform 0.2s ease; }
  #btn-no.floating { position: absolute; z-index: 5; width: 140px; }

  .attempts { font-size: 0.9rem; color: #a08aa8; margin-top: 14px; min-height: 22px; font-weight: 500; }
  .attempts b { color: #c0396b; }

  .date-option {
    display: flex; flex-direction: column; align-items: center; gap: 4px;
    width: 100%; padding: 12px 16px; border-radius: 14px;
    background: #fdf2f8; margin-bottom: 8px; transition: background 0.4s ease;
  }
  .date-option .date-main { font-size: 1.1rem; font-weight: 700; color: #c0396b; }
  .date-option .weather { font-size: 0.85rem; color: #7a6a7a; line-height: 1.4; }

  .result {
    font-size: 1.05rem; color: #3a2a3a; line-height: 1.7; text-align: left;
    background: #fdf2f8; border-radius: 16px; padding: 18px; margin-top: 16px;
    transition: background 0.4s ease;
  }
  .result b { color: #c0396b; }

  .love-note {
    margin-top: 18px; padding: 16px;
    background: linear-gradient(135deg, #fff0f5, #ffe4ec);
    border-radius: 16px; font-size: 1.1rem; color: #c0396b; font-weight: 700;
    line-height: 1.6; transition: background 0.4s ease;
  }
  .hint { font-size: 0.85rem; color: #a08aa8; margin-top: 16px; }

  .custom-input-wrap { display: flex; flex-direction: column; gap: 8px; margin-top: 8px; }
  .custom-input-wrap input {
    width: 100%; padding: 13px 16px; border-radius: 14px;
    border: 2px solid #e0c8d8; font-size: 1rem; font-family: inherit;
    outline: none; transition: border 0.2s ease, background 0.3s ease;
  }
  .custom-input-wrap input:focus { border-color: #c0396b; }

  /* --- Сердечки --- */
  .hearts {
    position: fixed; top: 0; left: 0; width: 100%; height: 100%;
    pointer-events: none; overflow: hidden; z-index: 0;
  }
  .heart { position: absolute; font-size: 22px; animation: floatUp 6s linear infinite; opacity: 0; }
  @keyframes floatUp {
    0%   { transform: translateY(100vh) scale(0.6); opacity: 0; }
    10%  { opacity: 0.8; }
    100% { transform: translateY(-10vh) scale(1.1); opacity: 0; }
  }

  /* --- Плюшевые зверята на главном экране --- */
  .plush-toys {
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 2;
    display: flex;
    align-items: flex-end;
    justify-content: space-between;
    padding: 0 12px 18px;
  }
  .plush {
    font-size: 72px;
    line-height: 1;
    filter: drop-shadow(0 8px 16px rgba(0, 0, 0, 0.25));
    animation: plushBounce 3s ease-in-out infinite;
    transition: opacity 0.4s ease, transform 0.4s ease;
  }
  .plush.panda { transform-origin: bottom left; }
  .plush.alpaca { transform-origin: bottom right; animation-delay: 1.5s; }
  @keyframes plushBounce {
    0%, 100% { transform: translateY(0) rotate(-3deg); }
    50%      { transform: translateY(-10px) rotate(3deg); }
  }
  /* Скрываем зверят, когда уходим с главного экрана */
  .plush-toys.hidden .plush { opacity: 0; transform: scale(0.5); }

  @media (max-width: 520px) {
    .plush { font-size: 52px; }
  }
</style>
</head>
<body class="theme-default">

<div class="hearts" id="hearts"></div>

<!-- Плюшевые зверята на главном экране -->
<div class="plush-toys" id="plushToys">
  <div class="plush panda">🐼</div>
  <div class="plush alpaca">🦙</div>
</div>

<div class="card" id="card">
  <h1>💌 Приглашение на свидание</h1>
  <p class="subtitle">Оренбург · небольшой квест, принцесса</p>
  <div id="app"></div>
</div>

<script>
const state = { step: "agreement", answers: {}, escapes: 0 };
const app = document.getElementById("app");
const card = document.getElementById("card");
const body = document.body;
const plushToys = document.getElementById("plushToys");

function setTheme(theme) { body.className = "theme-" + theme; }

// Показывать/скрывать плюшевых зверят (только на главном экране)
function setPlushVisible(visible) {
  if (!plushToys) return;
  plushToys.classList.toggle("hidden", !visible);
}

const cuisineTheme = {
  "Италия": "italy",
  "Грузия": "georgia",
  "Азия": "asia",
  "Общая": "general",
};

const weatherData = {
  "31.10.2026": "🌡️ +9…+10°C · ветер 7 м/с · пасмурно, вероятность осадков 100%",
  "01.11.2026": "🌡️ +5…+6°C · ветер 3–5 м/с · дождь, вероятность 79%",
};

const cuisineRestaurants = {
  "Италия": ["Chilini"],
  "Грузия": ["Танцевули", "Хинкальная на Поляничко", "Nino Vano"],
  "Азия": [],
  "Общая": ["Счастье радость", "Хорошая компания"],
};

const parks = ["Набережная", "Советская", "Ивушки"];

function render(question, buttonsHtml, extraHtml = "") {
  app.innerHTML = `
    <div class="question">${question}</div>
    <div class="buttons">${buttonsHtml}</div>
    ${extraHtml}
  `;
}

function renderResult() {
  const a = state.answers;
  app.innerHTML = `
    <div class="question">💐 Итог нашего свидания:</div>
    <div class="result">
      📅 Дата: <b>${a.day}</b><br>
      📍 Место: <b>${a.place}</b><br>
      ${a.park ? `🌳 Парк: <b>${a.park}</b><br>` : ""}
      ${a.cuisine ? `🍽️ Кухня: <b>${a.cuisine}</b><br>` : ""}
      ${a.restaurant ? `🍴 Ресторан: <b>${a.restaurant}</b><br>` : ""}
      ⏰ Время: <b>${a.time}</b><br>
      🚗 Транспорт: <b>${a.transport}</b>
    </div>
    <div class="love-note">❤️ И самое главное…<br>Я тебя очень люблю. 💐</div>
    <div class="buttons" style="margin-top:16px;">
      <button class="ghost" onclick="restart()">🔄 Пройти заново</button>
    </div>
    <p class="hint">Тогда до встречи, принцесса! 💐</p>
  `;
  saveAnswers();
}

function showAgreement() {
  state.step = "agreement";
  state.escapes = 0;
  setTheme("default");
  setPlushVisible(true); // зверята только на главном экране
  const attemptsHtml = `<div class="attempts" id="attempts">Попыток нажать «Нет»: <b>0</b> из 5</div>`;
  render(
    "Ты пойдёшь со мной на свидание, да или нет?",
    `
      <button onclick="agreementYes()">Да 💚</button>
      <button id="btn-no" class="secondary" type="button">Нет 💔</button>
    `,
    attemptsHtml
  );
  setupRunawayButton();
}

function agreementYes() {
  state.step = "day";
  setPlushVisible(false);
  showDateOptions();
}

function showDateOptions() {
  setTheme("default");
  const dates = ["31.10.2026", "01.11.2026"];
  const buttonsHtml = dates.map(d => `
    <div class="date-option">
      <span class="date-main">${d}</span>
      <span class="weather">${weatherData[d]}</span>
      <button style="margin-top:6px; padding:10px 18px; font-size:0.95rem;"
              onclick="chooseDay('${d}')">Выбрать эту дату</button>
    </div>
  `).join("");
  render("Отличная новость! 😊<br><br>В какие числа ты свободна? (прогноз для Оренбурга)", buttonsHtml);
}

function setupRunawayButton() {
  const btn = document.getElementById("btn-no");
  const attemptsEl = document.getElementById("attempts");
  if (!btn) return;

  const updateAttempts = () => {
    if (attemptsEl) attemptsEl.innerHTML = `Попыток нажать «Нет»: <b>${state.escapes}</b> из 5`;
  };

  const escape = (e) => {
    if (e) e.preventDefault();
    if (state.escapes >= 5) {
      btn.textContent = "Ладно, уговорил 😅";
      btn.classList.remove("floating");
      btn.style.left = ""; btn.style.top = "";
      btn.onclick = () => alert("Правильный ответ всё равно «Да»! 😄");
      return;
    }
    state.escapes++; updateAttempts();
    const cardRect = card.getBoundingClientRect();
    const btnRect = btn.getBoundingClientRect();
    if (!btn.classList.contains("floating")) {
      btn.style.left = (btnRect.left - cardRect.left) + "px";
      btn.style.top = (btnRect.top - cardRect.top) + "px";
      btn.classList.add("floating");
    }
    const maxX = card.clientWidth - btn.offsetWidth - 16;
    const maxY = card.clientHeight - btn.offsetHeight - 16;
    btn.style.left = Math.max(8, Math.random() * maxX) + "px";
    btn.style.top = Math.max(8, Math.random() * maxY) + "px";
    if (state.escapes >= 5) {
      setTimeout(() => {
        btn.textContent = "Ладно, уговорил 😅";
        btn.classList.remove("floating");
        btn.style.left = ""; btn.style.top = "";
        btn.onclick = () => alert("Правильный ответ всё равно «Да»! 😄");
      }, 300);
    }
  };
  btn.addEventListener("mouseenter", escape);
  btn.addEventListener("touchstart", escape, { passive: false });
  btn.addEventListener("click", escape);
}

function chooseDay(day) {
  state.answers.day = day;
  state.step = "place";
  setTheme("default");
  render(
    `Отлично, значит <b>${day}</b>! ✅<br><br>Куда пойдём?`,
    `
      <button onclick="choosePlace('restaurant')">🍽️ Ресторан</button>
      <button class="secondary" onclick="choosePlace('park')">🌳 Прогулка по парку</button>
    `
  );
}

function choosePlace(place) {
  if (place === "restaurant") {
    state.answers.place = "Ресторан";
    state.step = "cuisine";
    setTheme("romantic");
    render(
      "Отличный выбор! 🍽️<br><br>Выбирай направление кухни:",
      `
        <button onclick="chooseCuisine('Италия')">🍝 Италия</button>
        <button onclick="chooseCuisine('Грузия')">🥟 Грузия</button>
        <button onclick="chooseCuisine('Азия')">🍜 Азия</button>
        <button class="secondary" onclick="chooseCuisine('Общая')">🍽️ Общая</button>
      `
    );
  } else {
    state.answers.place = "Прогулка по парку";
    state.step = "park";
    setTheme("forest");
    showParkOptions();
  }
}

function showParkOptions() {
  setTheme("forest");
  const buttons = parks.map(p =>
    `<button onclick="choosePark('${p}')">🌳 ${p}</button>`
  ).join("");
  const customBtn = `<button class="secondary" onclick="showCustomPark()">✏️ Свой вариант</button>`;
  render(
    "Отличный выбор — прогулка по парку! 🌳<br>Возьму плед и что-нибудь вкусное для пикника 🧺<br><br>Какой парк выберем?",
    buttons + customBtn
  );
}

function showCustomPark() {
  state.step = "park_custom";
  setTheme("forest");
  render(
    "Напиши название парка или места для прогулки:",
    `
      <div class="custom-input-wrap">
        <input type="text" id="custom-park-input" placeholder="Например, «Лесопарк»"
               autocomplete="off" />
        <button onclick="submitCustomPark()">Готово ✅</button>
        <button class="ghost" onclick="showParkOptions()">← Назад</button>
      </div>
    `
  );
  const input = document.getElementById("custom-park-input");
  if (input) {
    input.focus();
    input.addEventListener("keydown", (e) => {
      if (e.key === "Enter") submitCustomPark();
    });
  }
}

function submitCustomPark() {
  const input = document.getElementById("custom-park-input");
  if (!input) return;
  const value = input.value.trim();
  if (!value) {
    input.style.borderColor = "#e8567a";
    input.placeholder = "Название не может быть пустым";
    return;
  }
  choosePark(value);
}

function choosePark(park) {
  state.answers.park = park;
  state.step = "time";
  setTheme("forest");
  const parkMessages = {
    "Набережная": "Отлично, Набережная — красиво и ветерок! 🌊",
    "Советская": "Советская — уютно и зелено! 🌲",
    "Ивушки": "Ивушки — романтично и тихо! 🌿",
  };
  const msg = parkMessages[park] || `Отлично, «${park}» — хороший выбор! 🌳`;
  render(`${msg}<br><br>Когда тебе удобнее?`, timeButtons());
}

function chooseCuisine(cuisine) {
  state.answers.cuisine = cuisine;
  state.step = "restaurant";
  setTheme(cuisineTheme[cuisine] || "romantic");

  const options = cuisineRestaurants[cuisine] || [];
  let buttons = options.map(r =>
    `<button onclick="chooseRestaurant('${r.replace(/'/g, "\\'")}')">🍴 ${r}</button>`
  ).join("");
  buttons += `<button class="secondary" onclick="showCustomRestaurant('${cuisine}')">✏️ Свой вариант</button>`;

  render(
    `Кухня: <b>${cuisine}</b><br><br>Выбери ресторан:`,
    buttons
  );
}

function showCustomRestaurant(cuisine) {
  state.step = "restaurant_custom";
  setTheme(cuisineTheme[cuisine] || "romantic");
  render(
    `Кухня: <b>${cuisine}</b><br><br>Напиши название ресторана, который ты хочешь:`,
    `
      <div class="custom-input-wrap">
        <input type="text" id="custom-rest-input" placeholder="Например, «Мой любимый»"
               autocomplete="off" />
        <button onclick="submitCustomRestaurant()">Готово ✅</button>
        <button class="ghost" onclick="chooseCuisine('${cuisine}')">← Назад</button>
      </div>
    `
  );
  const input = document.getElementById("custom-rest-input");
  if (input) {
    input.focus();
    input.addEventListener("keydown", (e) => {
      if (e.key === "Enter") submitCustomRestaurant();
    });
  }
}

function submitCustomRestaurant() {
  const input = document.getElementById("custom-rest-input");
  if (!input) return;
  const value = input.value.trim();
  if (!value) {
    input.style.borderColor = "#e8567a";
    input.placeholder = "Название не может быть пустым";
    return;
  }
  chooseRestaurant(value);
}

function chooseRestaurant(restaurant) {
  state.answers.restaurant = restaurant;
  state.step = "time";
  const cuisine = state.answers.cuisine;
  setTheme(cuisineTheme[cuisine] || "romantic");
  render(
    `Отлично, выбрали: <b>${restaurant}</b> 🍴<br><br>Когда тебе удобнее?`,
    timeButtons()
  );
}

function timeButtons() {
  return `
    <button onclick="chooseTime('Обеденное время')">🕐 Обеденное время</button>
    <button class="secondary" onclick="chooseTime('Вечернее время')">🌆 Вечернее время</button>
  `;
}

function chooseTime(time) {
  state.answers.time = time;
  state.step = "transport";
  const cuisine = state.answers.cuisine;
  if (state.answers.place === "Ресторан") {
    setTheme(cuisineTheme[cuisine] || "romantic");
  } else {
    setTheme("forest");
  }
  render(
    `Отлично, значит встречаемся в <b>${time.toLowerCase()}</b>!<br><br>Как добираться?`,
    `
      <button onclick="chooseTransport('На машине')">🚗 На машине</button>
      <button class="secondary" onclick="chooseTransport('На такси')">🚕 На такси</button>
    `
  );
}

function chooseTransport(transport) {
  state.answers.transport = transport;
  state.step = "more";
  const cuisine = state.answers.cuisine;
  if (state.answers.place === "Ресторан") {
    setTheme(cuisineTheme[cuisine] || "romantic");
  } else {
    setTheme("forest");
  }
  render(
    `Тогда поедем ${transport.toLowerCase()}! 🚗<br><br>Хочешь выбрать ещё что-нибудь?`,
    `
      <button onclick="moreYes()">✅ Да, ещё</button>
      <button class="secondary" onclick="moreNo()">🏁 Нет, хватит</button>
    `
  );
}

function moreYes() {
  state.step = "place";
  delete state.answers.place;
  delete state.answers.park;
  delete state.answers.cuisine;
  delete state.answers.restaurant;
  setTheme("default");
  render(
    "Хорошо, давай ещё раз. Куда пойдём?",
    `
      <button onclick="choosePlace('restaurant')">🍽️ Ресторан</button>
      <button class="secondary" onclick="choosePlace('park')">🌳 Прогулка по парку</button>
    `
  );
}

function moreNo() {
  state.step = "done";
  const cuisine = state.answers.cuisine;
  if (state.answers.place === "Ресторан") {
    setTheme(cuisineTheme[cuisine] || "romantic");
  } else {
    setTheme("forest");
  }
  renderResult();
}

function restart() {
  state.step = "agreement";
  state.answers = {};
  state.escapes = 0;
  setTheme("default");
  showAgreement();
}

function saveAnswers() {
  const record = { timestamp: new Date().toISOString(), ...state.answers };
  try {
    const existing = JSON.parse(localStorage.getItem("dateAnswers") || "[]");
    existing.push(record);
    localStorage.setItem("dateAnswers", JSON.stringify(existing));
  } catch (e) {
    console.warn("localStorage недоступен:", e);
  }
}

function createHearts() {
  const container = document.getElementById("hearts");
  const emojis = ["💖", "💕", "💗", "🌹", "✨"];
  for (let i = 0; i < 40; i++) {          // было 18 — стало 40
    const heart = document.createElement("div");
    heart.className = "heart";
    heart.textContent = emojis[Math.floor(Math.random() * emojis.length)];
    heart.style.left = Math.random() * 100 + "%";
    heart.style.animationDelay = Math.random() * 6 + "s";
    heart.style.animationDuration = (4 + Math.random() * 5) + "s";
    heart.style.fontSize = (14 + Math.random() * 20) + "px";
    container.appendChild(heart);
  }
}

createHearts();
showAgreement();
</script>
</body>
</html>
